<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scraping Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1>Job Scraping Dashboard</h1>
        <p class="lead">Select a country, city, and number of jobs to scrape.</p>
        <!-- Settings Button -->
        <button class="btn btn-secondary" onclick="openSettingsModal()">Settings</button>
    </div>

    <!-- Job Scraping Form -->
    <div class="card p-4 shadow-lg">
        <div class="card-body">
            <label for="country-select" class="form-label">Country</label>
            <select id="country-select" class="form-select mb-3" onchange="updateCities()">
                <option value="" disabled selected>Select a country</option>
                {% for entry in entries %}
                <option value="{{ entry.id }}">{{ entry.country }}</option>
                {% endfor %}
            </select>

            <label for="city-select" class="form-label">City</label>
            <select id="city-select" class="form-select mb-3">
                <option value="" disabled selected>Select a city</option>
            </select>

            <label for="num-jobs" class="form-label">Number of Jobs to Scrape</label>
            <input type="number" id="num-jobs" class="form-control mb-3" placeholder="Enter number of jobs" min="1">
            
            <button id="scrapeButton" onclick="startScraping()" class="btn btn-primary btn-lg">
                <span id="scrapeButtonText">Start Scraping</span>
            </button>
                </div>
    </div>

    <hr>

    <!-- Scraping Summary Section -->
    <div class="text-center mb-5 mt-4">
        <h2>Scraping Summary</h2>
        <div class="input-group mb-3">
            <span class="input-group-text">Select Date:</span>
            <input type="date" id="summaryDate" class="form-control" value="">
            <button class="btn btn-primary" onclick="loadScrapingSummary()">Filter</button>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Country</th>
                    <th>City</th>
                    <th>Jobs Scraped</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="summaryTableBody">
                <!-- Data will be populated here -->
            </tbody>
        </table>
    </div>
</div>

<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="settingsModalLabel">Settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Main Tabs for Each Entity (Title, Company, Location, etc.) -->
          <ul class="nav nav-tabs" id="entityTabs" role="tablist">
            <li class="nav-item">
              <button class="nav-link active" id="title-tab" data-bs-toggle="tab" data-bs-target="#title" type="button" role="tab" aria-controls="title" aria-selected="true">Title</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="company-tab" data-bs-toggle="tab" data-bs-target="#company" type="button" role="tab" aria-controls="company" aria-selected="false">Company</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="location-tab" data-bs-toggle="tab" data-bs-target="#location" type="button" role="tab" aria-controls="location" aria-selected="false">Location</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="salary-tab" data-bs-toggle="tab" data-bs-target="#salary" type="button" role="tab" aria-controls="salary" aria-selected="false">Salary</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="type-tab" data-bs-toggle="tab" data-bs-target="#type" type="button" role="tab" aria-controls="type" aria-selected="false">Type</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="description-tab" data-bs-toggle="tab" data-bs-target="#description" type="button" role="tab" aria-controls="description" aria-selected="false">Description</button>
            </li>
          </ul>
  
          <!-- Tab Content for Each Entity -->
          <div class="tab-content mt-3" id="entityTabContent">
            <!-- Template for settings content with add and remove options -->
            <script type="text/template" id="settings-template">
              <div class="entry mb-2 row">
                <div class="col-md-5">
                  <input type="text" class="form-control remove-word" placeholder="Word to remove/replace">
                </div>
                <div class="col-md-5">
                  <input type="text" class="form-control replacement-word" placeholder="Replacement (leave empty to remove)">
                </div>
                <div class="col-md-2">
                  <button type="button" class="btn btn-danger remove-entry">Remove</button>
                </div>
              </div>
            </script>
  
            <!-- Settings Content for Each Entity -->
            <div class="tab-pane fade show active" id="title" role="tabpanel" aria-labelledby="title-tab">
              <h6>Title Settings</h6>
              <div id="title-settings">
                <!-- Dynamic entries will be added here -->
              </div>
              <button type="button" class="btn btn-secondary mt-2" onclick="addEntry('title')">Add New Entry</button>
            </div>
  
            <div class="tab-pane fade" id="company" role="tabpanel" aria-labelledby="company-tab">
              <h6>Company Settings</h6>
              <div id="company-settings">
                <!-- Dynamic entries will be added here -->
              </div>
              <button type="button" class="btn btn-secondary mt-2" onclick="addEntry('company')">Add New Entry</button>
            </div>
  
            <div class="tab-pane fade" id="location" role="tabpanel" aria-labelledby="location-tab">
              <h6>Location Settings</h6>
              <div id="location-settings">
                <!-- Dynamic entries will be added here -->
              </div>
              <button type="button" class="btn btn-secondary mt-2" onclick="addEntry('location')">Add New Entry</button>
            </div>
  
            <div class="tab-pane fade" id="salary" role="tabpanel" aria-labelledby="salary-tab">
              <h6>Salary Settings</h6>
              <div id="salary-settings">
                <!-- Dynamic entries will be added here -->
              </div>
              <button type="button" class="btn btn-secondary mt-2" onclick="addEntry('salary')">Add New Entry</button>
            </div>
  
            <div class="tab-pane fade" id="type" role="tabpanel" aria-labelledby="type-tab">
              <h6>Type Settings</h6>
              <div id="type-settings">
                <!-- Dynamic entries will be added here -->
              </div>
              <button type="button" class="btn btn-secondary mt-2" onclick="addEntry('type')">Add New Entry</button>
            </div>
  
            <div class="tab-pane fade" id="description" role="tabpanel" aria-labelledby="description-tab">
              <h6>Description Settings</h6>
              <div id="description-settings">
                <!-- Dynamic entries will be added here -->
              </div>
              <button type="button" class="btn btn-secondary mt-2" onclick="addEntry('description')">Add New Entry</button>
            </div>
          </div>
  
          <!-- Save Button -->
          <button type="button" class="btn btn-primary mt-3" onclick="saveSettings()">Save</button>
        </div>
      </div>
    </div>
  </div>
<<!-- Place this at the bottom of your index.html, before the closing body tag -->
<script>
    let citiesData = {{ entries | tojson }};
    
    function updateCities() {
        let countryId = $("#country-select").val();
        let selectedCountry = citiesData.find(entry => entry.id == countryId);
        
        if (selectedCountry) {
            $("#city-select").empty().append('<option value="" disabled selected>Select a city</option>');
            selectedCountry.cities.forEach(city => {
                $("#city-select").append(`<option value="${city}">${city}</option>`);
            });
        }
    }

    function scrapeJob() {
        let countryId = $("#country-select").val();
        let selectedCity = $("#city-select").val();
        let numJobs = $("#num-jobs").val();

        if (!countryId || !selectedCity || !numJobs) {
            alert("Please select a country, city, and specify the number of jobs.");
            return;
        }

        const exclusionSettings = getExclusionSettings();
        $.post("/scrape_jobs", {
            country_id: countryId,
            city: selectedCity,
            num_jobs: numJobs,
            exclusions: exclusionSettings
        }, function(data) {
            alert(data.message);
        }).fail(function() {
            alert("An error occurred while starting the scrape.");
        });
    }

    function loadScrapingSummary() {
        const date = $("#summaryDate").val();
        $.getJSON("/get_scraping_summary", {date: date}, function(data) {
            const tableBody = $("#summaryTableBody");
            tableBody.empty();
            
            data.forEach(row => {
                tableBody.append(`
                    <tr>
                        <td>${row.Date}</td>
                        <td>${row.Country}</td>
                        <td>${row.City}</td>
                        <td>${row["Job Count"]}</td>
                        <td><button onclick="viewFile('${row.FilePath}')" class="btn btn-sm btn-info">View</button></td>
                    </tr>
                `);
            });
        });
    }

    function viewFile(filePath) {
        // Convert the file path to a relative path from the app's root
        const relativePath = filePath.replace('/Users/naveedabbas/web_scrapping_tool/', '');
        
        // Redirect with the relative path encoded for special characters
        window.location.href = `/view_file?file_path=${encodeURIComponent(relativePath)}`;
    }

    function openSettingsModal() {
    console.log("Opening settings modal...");
    $.getJSON("/get_settings", function(data) {
        console.log("Data received from /get_settings:", data); // Log the data to see what was fetched

        const entities = ['title', 'company', 'location', 'salary', 'type', 'description'];
        
        entities.forEach(entity => {
            const container = $('#' + entity + '-settings');
            container.empty(); // Clear previous entries
            
            console.log(`Populating entries for ${entity}:`, data[entity]); // Log each entity's entries

            (data[entity] || []).forEach(entry => {
                addEntry(entity, entry.remove, entry.replace);
            });
        });
    }).done(function() {
        console.log("Showing modal after loading entries.");
        $('#settingsModal').modal('show');
    }).fail(function(jqXHR, textStatus, errorThrown) {
        console.error("Error fetching settings:", textStatus, errorThrown); // Log any errors
    });
}

// Function to add a new entry field with optional values for remove/replace
function addEntry(entity, removeWord = '', replaceWord = '') {
    const template = $($('#settings-template').html());
    template.find('.remove-word').val(removeWord); // Set remove word if provided
    template.find('.replacement-word').val(replaceWord); // Set replace word if provided
    template.find('.remove-entry').click(function() {
        $(this).closest('.entry').remove(); // Remove the entry when 'Remove' button is clicked
    });
    $('#' + entity + '-settings').append(template); // Append the entry to the specific entity's container
}


// Function to gather all settings and send to the server
function saveSettings() {
    const settings = {};
    const entities = ['title', 'company', 'location', 'salary', 'type', 'description'];

    entities.forEach(entity => {
        const entries = [];
        $('#' + entity + '-settings .entry').each(function() {
            const removeWord = $(this).find('.remove-word').val().trim();
            const replaceWord = $(this).find('.replacement-word').val().trim();

            if (removeWord) {
                entries.push({ remove: removeWord, replace: replaceWord || null });
            }
        });
        settings[entity] = entries;
    });

    $.ajax({
        url: '/save_exclusions',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(settings),
        success: function(response) {
            $('#settingsModal').modal('hide');
            alert(response.message);
        },
        error: function() {
            alert("Error saving settings.");
        }
    });
}

    function saveExclusionSettings() {
        const exclusions = {
            Title: $('#excludeTitle').val().split(',').map(word => word.trim()).filter(Boolean),
            Company: $('#excludeCompany').val().split(',').map(word => word.trim()).filter(Boolean),
            Location: $('#excludeLocation').val().split(',').map(word => word.trim()).filter(Boolean),
            Salary: $('#excludeSalary').val().split(',').map(word => word.trim()).filter(Boolean),
            Type: $('#excludeType').val().split(',').map(word => word.trim()).filter(Boolean),
            Description: $('#excludeDescription').val().split(',').map(word => word.trim()).filter(Boolean),
        };

        console.log("Sending exclusions to server:", exclusions);

        $.ajax({
            url: '/save_exclusions',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(exclusions),
            success: function(response) {
                console.log("Server response:", response);
                $('#settingsModal').modal('hide');
                alert(response.message);
            },
            error: function(jqXHR, textStatus, errorThrown) {
                console.error("Error saving exclusions:", textStatus, errorThrown);
                alert("Error saving exclusions.");
            }
        });
    }

    function getExclusionSettings() {
        const settings = localStorage.getItem('exclusionSettings');
        return settings ? JSON.parse(settings) : {};
    }

    $(document).ready(function() {
        const today = new Date().toISOString().split('T')[0];
        $("#summaryDate").val(today);
        loadScrapingSummary();
    });


    let scrapingInProgress = false;

function startScraping() {
    if (scrapingInProgress) return;

    const countryId = $("#country-select").val();
    const selectedCity = $("#city-select").val();
    const numJobs = $("#num-jobs").val();

    if (!countryId || !selectedCity || !numJobs) {
        alert("Please select a country, city, and specify the number of jobs.");
        return;
    }

    scrapingInProgress = true;
    updateScrapeButton("Scraping in Progress...", true);

    // Start scraping
    $.post("/scrape_jobs", {
        country_id: countryId,
        city: selectedCity,
        num_jobs: numJobs
    }, function (data) {
        console.log(data.message);
        if (data.message.includes("started")) {
            checkScrapingStatus();
        }
    }).fail(function () {
        alert("An error occurred while starting the scrape.");
        scrapingInProgress = false;
        updateScrapeButton("Start Scraping", false);
    });
}

// Function to update the button's text and disable/enable it
function updateScrapeButton(text, isDisabled) {
    $("#scrapeButtonText").text(text);
    $("#scrapeButton").prop("disabled", isDisabled);
}

// Function to check scraping progress every few seconds
function checkScrapingStatus() {
    const intervalId = setInterval(() => {
        $.getJSON("/scraping_progress", function (status) {
            if (status.completed >= status.total && status.total > 0) {
                scrapingInProgress = false;
                updateScrapeButton("Scraping Done!", false);
                clearInterval(intervalId);
            }
        });
    }, 3000); // Check every 3 seconds
}
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
